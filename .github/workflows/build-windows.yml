name: Build and Release Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit & integration tests (headless)
        run: cargo test --no-default-features

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Windows compile & unit tests
        run: cargo test
      - name: Build release airpad.exe
        run: cargo build --release
      - name: Package Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/airpad.exe dist/airpad.exe
          Copy-Item launch-airpad.bat dist/launch-airpad.bat
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath airpad-windows-x86_64.zip -Force
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airpad-windows-x86_64
          path: |
            target/release/airpad.exe
            airpad-windows-x86_64.zip
      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/airpad.exe
            airpad-windows-x86_64.zip
